<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primedle</title>
  <meta name="description" content="A daily number game: drop the ball on the prime closest to today's number.">
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/game.js"></script>
</head>
<body>
  <main class="game">
    <div class="score" id="score" role="status"></div>
    <canvas id="bar" tabindex="0" aria-label="Number line. Move the ball anywhere to aim, click or press Enter to drop. Arrow keys also move the ball."></canvas>
    <div class="readout" id="readout" aria-live="polite">
      <span class="crt">
        <span class="readout-value" id="readout-value"></span>
        <span class="readout-delta" id="readout-delta"></span>
      </span>
    </div>
    <div class="tries" id="tries" aria-label="Tries"></div>
    <button class="music" id="music" type="button" aria-pressed="true" title="Music (M)" aria-label="Music">
      <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
        <path d="M1 4h2v4H1zM3 3h1v6H3zM4 2h1v8H4zM5 1h1v10H5z"/>
        <path class="on" d="M7 4h1v4H7zM9 2h1v8H9z"/>
        <path class="off" d="M7 4h1v1H7zM8 5h1v1H8zM9 6h1v1H9zM10 7h1v1h-1zM10 4h1v1h-1zM9 5h1v1H9zM8 6h1v1H8zM7 7h1v1H7z"/>
      </svg>
    </button>
  </main>
  <canvas id="fx" aria-hidden="true"></canvas>
</body>
</html>
