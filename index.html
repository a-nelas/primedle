<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primedle</title>
  <meta name="description" content="A daily number game: drop the ball on the prime closest to today's number.">
  <meta name="theme-color" content="#0a0612">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/game.js"></script>
</head>
<body>
  <main class="game">
    <div class="bar-card">
      <div class="readout" id="readout" aria-live="polite">
        <span class="crt">
          <span class="readout-value" id="readout-value"></span>
          <span class="readout-delta" id="readout-delta"></span>
        </span>
      </div>
      <canvas id="bar" tabindex="0" aria-label="Number line. Move to aim, click or press Enter to drop. Arrow keys also move the ball."></canvas>
    </div>
    <div class="tries" id="tries" aria-label="Tries"></div>
  </main>
</body>
</html>
